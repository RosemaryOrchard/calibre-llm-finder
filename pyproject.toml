[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre-llm-finder"
version = "0.1.0"
description = "Find books in your Calibre library from fuzzy, half-remembered descriptions, using local LLMs (Ollama) for embeddings, semantic search and natural-language re-ranking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rich Orchard" }]
keywords = ["calibre", "llm", "ollama", "semantic-search", "rag", "ebooks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlite-vec>=0.1.3",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
clf = "calibre_llm_finder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/calibre_llm_finder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
